name: Windows Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify Sprocket foundation checkout
        shell: pwsh
        run: |
          $expected = '8c35b7604d5e859931dd83146b3a430591860d94'
          $head = (git -C third_party/sprocket rev-parse HEAD).Trim()
          if ($head -ne $expected) {
            throw "Sprocket submodule is at $head; expected $expected"
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -eq 'main') {
            $version = '1.0.3'
            $releaseTag = 'v1.0.3'
          }
          else {
            $version = "0.1.0.${{ github.run_number }}"
            $releaseTag = "v$version"
          }

          "MAGMAEDIT_VERSION=$version" >> $env:GITHUB_ENV
          "MAGMAEDIT_RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          Write-Host "MagmaEdit version: $version"
          Write-Host "MagmaEdit release tag: $releaseTag"

      - name: Restore
        run: dotnet restore MagmaEdit.slnx --runtime win-x64

      - name: Verify formatting
        run: dotnet format MagmaEdit.slnx --verify-no-changes --no-restore --exclude ./third_party/sprocket/

      - name: Build
        run: dotnet build MagmaEdit.slnx --configuration Release --no-restore

      - name: Prepare FFmpeg 8 natives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2026-03-10'
            'User-Agent' = 'MagmaEdit-Release'
          }

          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest' -Headers $headers
          $asset = $release.assets |
            Where-Object {
              $_.name -match 'win64-gpl-shared' -and
              $_.name -match 'n8\.' -and
              $_.name -match '\.zip$'
            } |
            Select-Object -First 1

          if (-not $asset) {
            throw 'Could not find a Windows FFmpeg 8 win64-gpl-shared ZIP in the latest BtbN release.'
          }

          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $extractRoot = Join-Path $env:RUNNER_TEMP 'MagmaEdit-FFmpeg8'
          if (Test-Path $extractRoot) {
            Remove-Item $extractRoot -Recurse -Force
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractRoot -Force

          $ffmpegBin = Get-ChildItem -Path $extractRoot -Filter 'avcodec-62.dll' -File -Recurse |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $ffmpegBin) {
            throw 'FFmpeg 8 archive was downloaded, but avcodec-62.dll was not found.'
          }

          $required = @('avutil-60.dll', 'swresample-6.dll', 'swscale-9.dll', 'avcodec-62.dll', 'avformat-62.dll', 'avfilter-11.dll', 'avdevice-62.dll')
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $ffmpegBin $name))) {
              throw "Required FFmpeg 8 native library is missing: $name"
            }
          }
          if (-not (Test-Path (Join-Path $ffmpegBin 'ffmpeg.exe'))) {
            throw 'FFmpeg 8 archive was downloaded, but ffmpeg.exe was not found.'
          }

          "SPROCKET_FFMPEG8_DIR=$ffmpegBin" >> $env:GITHUB_ENV
          "SPROCKET_FFMPEG8_REQUIRED=$($required -join ';')" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test MagmaEdit.slnx --configuration Release --no-build --verbosity normal

      - name: Publish MCP server
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\mcp'
          if (Test-Path $publishDir) {
            Remove-Item $publishDir -Recurse -Force
          }

          dotnet publish src/MagmaEdit.McpServer/MagmaEdit.McpServer.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $publishDir
          if ($LASTEXITCODE -ne 0) {
            throw "MCP server publish failed with exit code $LASTEXITCODE."
          }

          $exe = Join-Path $publishDir 'MagmaEdit.McpServer.exe'
          if (-not (Test-Path $exe)) {
            throw "The MCP publish output does not contain MagmaEdit.McpServer.exe."
          }

      - name: Smoke test MCP STDIO handshake
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\mcp'
          $exe = Join-Path $publishDir 'MagmaEdit.McpServer.exe'

          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $exe
          $startInfo.WorkingDirectory = $publishDir
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.Environment['MAGMAEDIT_MCP_TRANSPORT'] = 'stdio'

          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $startInfo

          try {
            if (-not $process.Start()) {
              throw 'Could not start the MCP server process.'
            }

            $initialize = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"MagmaEdit-CI","version":"1.0"}}}'
            $process.StandardInput.WriteLine($initialize)
            $process.StandardInput.Flush()

            $initializeLine = $process.StandardOutput.ReadLine()
            if ([string]::IsNullOrWhiteSpace($initializeLine)) {
              $stderr = $process.StandardError.ReadToEnd()
              throw "MCP server returned no initialize response. stderr: $stderr"
            }

            $initializeResponse = $initializeLine | ConvertFrom-Json
            if ($initializeResponse.error) {
              throw "MCP initialize failed: $($initializeResponse.error.message)"
            }
            if (-not $initializeResponse.result.protocolVersion) {
              throw 'MCP initialize response did not contain a negotiated protocolVersion.'
            }

            $initialized = '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
            $process.StandardInput.WriteLine($initialized)
            $process.StandardInput.Flush()

            $toolsList = '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            $process.StandardInput.WriteLine($toolsList)
            $process.StandardInput.Flush()

            $toolsLine = $process.StandardOutput.ReadLine()
            if ([string]::IsNullOrWhiteSpace($toolsLine)) {
              throw 'MCP server returned no tools/list response.'
            }

            $toolsResponse = $toolsLine | ConvertFrom-Json
            if ($toolsResponse.error) {
              throw "MCP tools/list failed: $($toolsResponse.error.message)"
            }

            $toolNames = @($toolsResponse.result.tools | ForEach-Object { $_.name })
            $expectedTools = @(
              'magmaedit.execute_editor_command',
              'magmaedit.get_editor_state'
            )
            foreach ($expectedTool in $expectedTools) {
              if ($toolNames -notcontains $expectedTool) {
                throw "MCP tools/list did not expose expected tool '$expectedTool'."
              }
            }

            Write-Host "MCP STDIO handshake succeeded with protocol $($initializeResponse.result.protocolVersion)."
            Write-Host "MCP tools exposed: $($toolNames -join ', ')"
          }
          finally {
            if (-not $process.HasExited) {
              $process.Kill($true)
              $process.WaitForExit()
            }
            $process.Dispose()
          }

      - name: Run MCP editor end-to-end flow
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\mcp'
          $exe = Join-Path $publishDir 'MagmaEdit.McpServer.exe'
          $projectRoot = Join-Path $env:RUNNER_TEMP 'MagmaEdit-McpE2E'
          $projectPath = Join-Path $projectRoot 'ai-e2e.magmaedit.json'

          if (Test-Path $projectRoot) {
            Remove-Item $projectRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $projectRoot -Force | Out-Null

          @'
{"id":"mcp-e2e-project","name":"MCP E2E","schemaVersion":1,"createdUtc":"2026-01-01T00:00:00+00:00","modifiedUtc":"2026-01-01T00:00:00+00:00","media":[]}
'@ | Set-Content -Path $projectPath -Encoding utf8

          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $exe
          $startInfo.WorkingDirectory = $publishDir
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.Environment['MAGMAEDIT_MCP_TRANSPORT'] = 'stdio'
          $startInfo.Environment['MAGMAEDIT_PROJECT_PATH'] = $projectPath

          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $startInfo

          function Send-McpRequest([string] $json) {
            $process.StandardInput.WriteLine($json)
            $process.StandardInput.Flush()
            $line = $process.StandardOutput.ReadLine()
            if ([string]::IsNullOrWhiteSpace($line)) {
              throw 'MCP server returned no response.'
            }
            $response = $line | ConvertFrom-Json
            if ($response.error) {
              throw "MCP request failed: $($response.error.message)"
            }
            return $response
          }

          try {
            if (-not $process.Start()) {
              throw 'Could not start the MCP server process.'
            }

            $initialize = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"MagmaEdit-CI","version":"1.0"}}}'
            $initializeResponse = Send-McpRequest $initialize
            if (-not $initializeResponse.result.protocolVersion) {
              throw 'MCP initialize response did not contain a negotiated protocolVersion.'
            }

            $initialized = '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
            $process.StandardInput.WriteLine($initialized)
            $process.StandardInput.Flush()

            $toolsList = '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            $toolsResponse = Send-McpRequest $toolsList
            $toolNames = @($toolsResponse.result.tools | ForEach-Object { $_.name })
            foreach ($expectedTool in @('magmaedit.execute_editor_command', 'magmaedit.get_editor_state')) {
              if ($toolNames -notcontains $expectedTool) {
                throw "Expected MCP tool '$expectedTool' was not exposed."
              }
            }

            $stateRequest = '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"magmaedit.get_editor_state","arguments":{}}}'
            $stateResponse = Send-McpRequest $stateRequest
            if (-not $stateResponse.result) {
              throw 'MCP get_editor_state returned no result.'
            }

            $commandRequest = '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"magmaedit.execute_editor_command","arguments":{"request":{"command":0,"name":"AI E2E Track"}}}}'
            $commandResponse = Send-McpRequest $commandRequest
            if (-not $commandResponse.result) {
              throw 'MCP execute_editor_command returned no result.'
            }

            $saved = Get-Content -Raw -Path $projectPath | ConvertFrom-Json
            if ($saved.schemaVersion -ne 2) {
              throw "MCP command did not persist the current project schema. Found schemaVersion=$($saved.schemaVersion)."
            }
            if (-not $saved.timeline -or @($saved.timeline.tracks).Count -ne 1) {
              throw 'MCP command did not persist the expected timeline track.'
            }
            if ($saved.timeline.tracks[0].name -ne 'AI E2E Track') {
              throw "Persisted track name was '$($saved.timeline.tracks[0].name)' instead of 'AI E2E Track'."
            }

            Write-Host "MCP E2E succeeded: initialize -> tools/list -> get_editor_state -> execute AddTrack -> persisted project state."
          }
          finally {
            if (-not $process.HasExited) {
              $process.Kill($true)
              $process.WaitForExit()
            }
            $process.Dispose()
          }

      - name: Publish Windows application
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish'
          if (Test-Path $publishDir) {
            Remove-Item $publishDir -Recurse -Force
          }

          $assemblyVersion = "$env:MAGMAEDIT_VERSION.0"
          dotnet publish src/MagmaEdit.App/MagmaEdit.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $publishDir `
            /p:Version=$env:MAGMAEDIT_VERSION `
            /p:AssemblyVersion=$assemblyVersion `
            /p:FileVersion=$assemblyVersion `
            /p:InformationalVersion=$env:MAGMAEDIT_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

          foreach ($name in ($env:SPROCKET_FFMPEG8_REQUIRED -split ';')) {
            Copy-Item (Join-Path $env:SPROCKET_FFMPEG8_DIR $name) $publishDir -Force
          }
          Copy-Item (Join-Path $env:SPROCKET_FFMPEG8_DIR 'ffmpeg.exe') $publishDir -Force

          if (-not (Test-Path (Join-Path $publishDir 'MagmaEdit.exe'))) {
            throw 'The Windows publish output does not contain MagmaEdit.exe.'
          }
          if (-not (Test-Path (Join-Path $publishDir 'ffmpeg.exe'))) {
            throw 'The Windows publish output does not contain ffmpeg.exe.'
          }

      - name: Smoke test published application startup
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish'
          $exe = Join-Path $publishDir 'MagmaEdit.exe'
          $process = $null
          try {
            $process = Start-Process -FilePath $exe -WorkingDirectory $publishDir -PassThru
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "MagmaEdit exited during startup smoke test with exit code $($process.ExitCode)."
            }
          }
          finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $installerDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\installer'
          if (Test-Path $installerDir) {
            Remove-Item $installerDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $installerDir -Force | Out-Null

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }

          & $iscc /DMagmaEditVersion="$env:MAGMAEDIT_VERSION" installer\MagmaEdit.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $installer = Get-ChildItem $installerDir -Filter '*-Setup.exe' -File | Select-Object -First 1
          if (-not $installer) {
            throw 'Windows installer was not created.'
          }

          Write-Host "Created installer: $($installer.FullName)"

      - name: Smoke test installed application startup
        shell: pwsh
        run: |
          $installer = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'artifacts\installer') -Filter '*-Setup.exe' -File | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'MagmaEdit-SmokeInstall'
          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null

          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "The MagmaEdit installer exited with code $($installerProcess.ExitCode)."
          }

          $installedExe = Join-Path $installDir 'MagmaEdit.exe'
          if (-not (Test-Path $installedExe)) {
            throw "The installer completed but $installedExe was not created."
          }

          $appProcess = $null
          try {
            $appProcess = Start-Process -FilePath $installedExe -WorkingDirectory $installDir -PassThru
            Start-Sleep -Seconds 8
            if ($appProcess.HasExited) {
              throw "Installed MagmaEdit exited during startup smoke test with exit code $($appProcess.ExitCode)."
            }
          }
          finally {
            if ($appProcess -and -not $appProcess.HasExited) {
              Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
            }
          }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (Test-Path $uninstaller) {
            & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          }

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref_name == 'main' && contains(github.event.head_commit.message, '[release-v1]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem artifacts\installer -Filter '*-Setup.exe' -File | Select-Object -First 1).FullName
          gh release create $env:MAGMAEDIT_RELEASE_TAG $installer --title "MagmaEdit $env:MAGMAEDIT_VERSION" --notes "MagmaEdit $env:MAGMAEDIT_VERSION Windows installer. Download the .exe below and install normally; no terminal is required."
