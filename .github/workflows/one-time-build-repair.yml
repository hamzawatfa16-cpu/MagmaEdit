name: One-Time Build Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply exact source repairs
        shell: pwsh
        run: |
          $dialogPath = 'src/MagmaEdit.App/ProjectNameDialog.cs'
          $dialog = [System.IO.File]::ReadAllText($dialogPath)
          $dialogPattern = '            SelectAllOnFocus = true,\r?\n'
          $dialogMatches = [regex]::Matches($dialog, $dialogPattern)
          if ($dialogMatches.Count -ne 1) {
            throw "Expected exactly one unsupported SelectAllOnFocus property; found $($dialogMatches.Count)."
          }
          $dialog = [regex]::Replace($dialog, $dialogPattern, '')
          [System.IO.File]::WriteAllText($dialogPath, $dialog, [System.Text.UTF8Encoding]::new($false))

          $windowPath = 'src/MagmaEdit.App/MainWindow.cs'
          $window = [System.IO.File]::ReadAllText($windowPath)
          $windowPattern = '            ProjectDocument project = _projectSession\.Open\(defaultPath\);\r?\n            return \(project, defaultPath\);'
          $windowMatches = [regex]::Matches($window, $windowPattern)
          if ($windowMatches.Count -ne 1) {
            throw "Expected exactly one overlapping project declaration; found $($windowMatches.Count)."
          }
          $window = [regex]::Replace($window, $windowPattern, '            ProjectDocument loadedProject = _projectSession.Open(defaultPath);`r`n            return (loadedProject, defaultPath);')
          [System.IO.File]::WriteAllText($windowPath, $window, [System.Text.UTF8Encoding]::new($false))

      - name: Normalize tracked C# line endings
        shell: pwsh
        run: |
          $files = git ls-files '*.cs' | Where-Object { $_ -notlike 'third_party/sprocket/*' }
          foreach ($file in $files) {
            $text = [System.IO.File]::ReadAllText($file)
            $text = $text -replace "`r?`n", "`r`n"
            if (-not $text.EndsWith("`r`n")) {
              $text += "`r`n"
            }
            [System.IO.File]::WriteAllText($file, $text, [System.Text.UTF8Encoding]::new($false))
          }

      - name: Commit repaired sources
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MagmaEdit.App/ProjectNameDialog.cs src/MagmaEdit.App/MainWindow.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Fix project workflow build errors'
            git push
          }
